name: CI

on:
  pull_request:
    branches:
      - main
      - 'integration/**'
  push:
    branches:
      - main
      - 'integration/**'

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm test
